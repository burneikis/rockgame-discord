<!doctype html>
<!--
  Discord activity art, rendered with the game's own stones, base, table and die.
  Serve with `npx vite` and shoot with `node art/shoot.mjs` (see art/README section in the main README).
  ?m=cover | bg | icon
-->
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: #15110d; }
  canvas { position: absolute; inset: 0; display: block; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, #0000 45%, #000a 100%); }
  .title { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .logo { font-weight: 900; line-height: 0.9; letter-spacing: 0.08em; margin: 0;
    background: linear-gradient(180deg, #f4efe8 0%, #b9ada0 55%, #7d7166 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0.04em 0 #000c) drop-shadow(0 0 0.25em #000a); }
  .sub { color: #e8b25c; font-weight: 700; font-style: italic; letter-spacing: 0.08em; text-shadow: 0 0.08em 0 #000a, 0 0 0.6em #000; }
</style>
</head>
<body>
<div class="vignette"></div>
<script type="module" src="./art.ts"></script>
</body>
</html>
